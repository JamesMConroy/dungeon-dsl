[project]
name = "dungeon-dsl"
version = "0.1.0"
description = "YAML DSL for dungeon graphs, validated and rendered to SVG maps"
readme = "README.md"
requires-python = ">=3.13"
# Runtime deps must stay installable in Pyodide 314.0.7 (pydantic 2.12.5, pyyaml 6.0.3).
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
cli = [
    "typer>=0.27.2",
]

[project.scripts]
dungeon-dsl = "dungeon_dsl.cli:app"

[dependency-groups]
dev = [
    "dungeon-dsl[cli]",
    "pyrefly>=1.1.1",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
# Agent worktrees live here; each one is linted from its own checkout.
extend-exclude = [".claude"]
