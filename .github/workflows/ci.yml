name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          # Only what these steps call; mise.toml also lists heavy local-only tools.
          install_args: just uv
      - run: just lint
      - run: just typecheck
      - run: just test
      - run: just test-lowest
