name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          # Only what these steps call; mise.toml also lists heavy local-only tools.
          install_args: just uv
      - run: just lint
      - run: just typecheck
      - run: just test
      - run: just test-lowest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: just uv node
      - run: just web-unit
      - run: just web-build
      - run: just web-browsers --with-deps
      - run: just web-test
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [python, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
