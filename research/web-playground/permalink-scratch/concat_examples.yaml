name: "Collision Test"
rooms:
  - id: a
    name: "Hub"
    entrance: true
    size: large
    exits:
      - {target: b, direction: e}
      - {target: c, direction: n}
  - id: b
    name: "East Wing"
    exits:
      - {target: a, direction: w}
      - {target: d, direction: n}
  - id: c
    name: "North Wing"
    exits:
      - {target: a, direction: s}
      - {target: shrine, direction: e}
  - id: d
    name: "Vault"
    size: tiny
    exits:
      - {target: b, direction: s}
  - id: shrine
    name: "Shrine"
    size: small
    exits:
      - {target: c, direction: w}
name: "Diagonal Test"
rooms:
  - id: hub
    name: "Central Cavern"
    size: small
    entrance: true
    exits:
      - {target: overlook, direction: ne}
      - {target: sump, direction: se}
  - id: overlook
    name: "Overlook"
    size: tiny
    exits:
      - {target: hub, direction: sw}
  - id: sump
    name: "Sump"
    size: small
    exits:
      - {target: hub, direction: nw}
      - {target: grotto, direction: e}
  - id: grotto
    name: "Grotto"
    size: tiny
    exits:
      - {target: sump, direction: w}
      - {target: closet, direction: e}

  # crowded-wall demo: the closet's n/s neighbours occupy both diagonal
  # corridors' vertical-first corner cells, forcing BOTH Ls out of the
  # tiny east wall (50px tall) — their openings overlap
  - id: closet
    name: "Cramped Closet"
    size: tiny
    exits:
      - {target: grotto, direction: w}
      - {target: gallery_n, direction: n}
      - {target: airshaft, direction: ne}
      - {target: gallery_s, direction: s}
      - {target: boltholes, direction: se}
  - id: gallery_n
    name: "Upper Gallery"
    exits:
      - {target: closet, direction: s}
  - id: airshaft
    name: "Airshaft"
    size: tiny
    exits:
      - {target: closet, direction: sw}
  - id: gallery_s
    name: "Lower Gallery"
    exits:
      - {target: closet, direction: n}
  - id: boltholes
    name: "Boltholes"
    size: tiny
    exits:
      - {target: closet, direction: nw}
name: "Goblin Warren"
level: 1
theme: "goblin_lair"
rooms:
  - id: entrance
    name: "Grand Hall"
    description: "A cavernous chamber with a vaulted ceiling. Bones litter the floor."
    size: large
    terrain: stone_floor
    light: dim
    entrance: true
    exits:
      - target: corridor_north
        direction: n
        type: archway
        state: open
      - target: treasure_room
        direction: e
        type: wooden
        state: closed
        dc: 10

  - id: corridor_north
    name: "North Passage"
    description: "A narrow tunnel. Torches flicker. Fresh air suggests openness ahead."
    size: small
    terrain: stone_floor
    light: dim
    exits:
      - target: entrance
        direction: s
        type: archway
        state: open
      - target: throne_room
        direction: n
        type: wooden
        state: locked
        dc: 12

  - id: throne_room
    name: "Goblin Throne"
    description: "A grand chamber with a crude throne of piled bones."
    size: large
    terrain: stone_floor
    light: bright
    exits:
      - target: corridor_north
        direction: s
        type: wooden
        state: locked
        dc: 12
      - target: escape_tunnel
        direction: n
        type: secret
        state: closed
        dc: 15

  - id: treasure_room
    name: "Storage Chamber"
    description: "Barrels and crates stacked haphazardly."
    size: medium
    terrain: dirt
    light: dark
    exits:
      - target: entrance
        direction: w
        type: wooden
        state: closed
        dc: 8

  - id: escape_tunnel
    name: "Hidden Escape Route"
    description: "A narrow natural cavern. Water drips from the ceiling."
    size: small
    terrain: water
    light: dark
    exits:
      - target: throne_room
        direction: s
        type: secret
        state: closed
        dc: 15
name: "Size Test"
# One of every room size, connected by straight corridors (both axes,
# mixed size pairs) and both L orientations:
#   - hall->vestry (ne) is corner-forced h-first (chapel blocks v-first)
#   - hall->oubliette (se) picks v-first via wall claims
rooms:
  - id: hall
    name: "Great Hall"
    size: vast
    entrance: true
    exits:
      - {target: barracks, direction: w, type: archway, state: open}
      - {target: chapel, direction: n}
      - {target: vestry, direction: ne}
      - {target: oubliette, direction: se, type: secret, state: hidden}
  - id: barracks
    name: "Barracks"
    size: large
    exits:
      - {target: hall, direction: e, type: archway, state: open}
  - id: chapel
    name: "Chapel"
    size: medium
    exits:
      - {target: hall, direction: s}
      - {target: vestry, direction: e, state: locked, dc: 12}
  - id: vestry
    name: "Vestry"
    size: small
    exits:
      - {target: chapel, direction: w, state: locked, dc: 12}
      - {target: hall, direction: sw}
      - {target: scriptorium, direction: e}
  - id: oubliette
    name: "Oubliette"
    size: tiny
    exits:
      - {target: hall, direction: nw, type: secret, state: hidden}
  - id: scriptorium
    name: "Scriptorium"
    size: tiny
    exits:
      - {target: vestry, direction: w}
